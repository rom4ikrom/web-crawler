plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.2.2'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'com.monzo.webcrawler.Main'
}

repositories {
    mavenCentral()
}

ext {
    jsoupVersion = '1.23.2'
    jacksonVersion = '3.2.2'
    lombokVersion = '1.18.46'
    log4jVersion = '2.26.1'

    // testing
    junitVersion = '6.1.3'
    assertJVersion = '3.27.7'
    mockitoVersion = '5.23.0'
    awaitilityVersion = '4.3.0'
    testcontainersVersion = '2.0.5'
}

dependencies {
    implementation "org.jsoup:jsoup:$jsoupVersion"

    implementation "tools.jackson.core:jackson-core:$jacksonVersion"
    implementation "tools.jackson.core:jackson-databind:$jacksonVersion"

    compileOnly "org.projectlombok:lombok:$lombokVersion"
    annotationProcessor "org.projectlombok:lombok:$lombokVersion"

    implementation "org.apache.logging.log4j:log4j-core:$log4jVersion"
    implementation "org.apache.logging.log4j:log4j-api:$log4jVersion"

    // testing
    testImplementation platform("org.junit:junit-bom:$junitVersion")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testCompileOnly "org.projectlombok:lombok:$lombokVersion"
    testAnnotationProcessor "org.projectlombok:lombok:$lombokVersion"

    testImplementation "org.assertj:assertj-core:$assertJVersion"
    testImplementation "org.mockito:mockito-junit-jupiter:$mockitoVersion"

    testImplementation "org.awaitility:awaitility:$awaitilityVersion"

    testImplementation "org.testcontainers:testcontainers:$testcontainersVersion"
    testImplementation "org.testcontainers:testcontainers-junit-jupiter:$testcontainersVersion"
}

test {
    useJUnitPlatform()
}